<!doctype html>
<html><head><meta charset="utf-8"><title>F-01 falsification</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --leading-paper: 120%;   /* what Paper stores */
    --leading-tw:    1.2;    /* what Tailwind ships */
    --color-ground: #F5E9DB;
    --color-ink: #24130A;
  }
</style>
<style>body{margin:0;font-family:system-ui;background:#F5E9DB;color:#24130A;width:1000px}</style>
</head><body>
<div class="flex gap-8 p-8">
  <div id="a" class="flex-1 bg-white p-6 text-md leading-paper">
    Parent 18px · leading-paper (120%)
    <div id="a-child" class="text-[40px]">Nested 40px child</div>
    Back to parent size
  </div>
  <div id="b" class="flex-1 bg-white p-6 text-md leading-tw">
    Parent 18px · leading-tw (1.2)
    <div id="b-child" class="text-[40px]">Nested 40px child</div>
    Back to parent size
  </div>
</div>
</body></html>
